services:
  - type: web
    name: lost-and-found-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npm run prisma:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lost-and-found-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lost-and-found-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGIN
        value: https://lost-and-found-one-swart.vercel.app
      - key: COOKIE_NAME
        value: lost_found_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false

databases:
  - name: lost-and-found-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: lost_and_found_db_m2vi
    user: lost_and_found_db_m2vi_user
    ipAllowList: []
