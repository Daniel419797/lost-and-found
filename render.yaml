services:
  - type: web
    name: lost-and-found-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lost-and-found-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: lost-and-found-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGIN
        value: https://lost-and-found-one-swart.vercel.app
      - key: COOKIE_NAME
        value: lost_found_refresh
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_REGION
        value: auto
